<svg width="100%" height="150" viewBox="0 0 1200 150" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Flujo: hardware, software, redes, cliente">
  <defs>
    <linearGradient id="flowGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#f5a524"/>
    </linearGradient>
  </defs>

  <line x1="150" y1="70" x2="1050" y2="70" stroke="#262b36" stroke-width="3"/>
  <line x1="150" y1="70" x2="1050" y2="70" stroke="url(#flowGrad)" stroke-width="3"
        stroke-dasharray="14 20" stroke-linecap="round">
    <animate attributeName="stroke-dashoffset" from="0" to="-68" dur="1.4s" repeatCount="indefinite"/>
  </line>

  <g text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
    <circle cx="150" cy="70" r="24" fill="#10131a" stroke="#22d3ee" stroke-width="3"/>
    <text x="150" y="120" fill="#9aa3af" font-size="15">Hardware</text>

    <circle cx="450" cy="70" r="24" fill="#10131a" stroke="#f5a524" stroke-width="3">
      <animate attributeName="r" values="24;28;24" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="450" y="120" fill="#9aa3af" font-size="15">Software</text>

    <circle cx="750" cy="70" r="24" fill="#10131a" stroke="#22d3ee" stroke-width="3"/>
    <text x="750" y="120" fill="#9aa3af" font-size="15">Redes</text>

    <circle cx="1050" cy="70" r="24" fill="#10131a" stroke="#f5a524" stroke-width="3">
      <animate attributeName="r" values="24;28;24" dur="1.8s" begin="0.9s" repeatCount="indefinite"/>
    </circle>
    <text x="1050" y="120" fill="#9aa3af" font-size="15">Cliente</text>
  </g>
</svg>
