<svg width="100%" height="260" viewBox="0 0 700 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Red neuronal animada, símbolo de inteligencia artificial">
  <defs>
    <radialGradient id="nnGlowCian" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nnGlowAmbar" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f5a524" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#f5a524" stop-opacity="0"/>
    </radialGradient>
    <filter id="nodeGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="700" height="260" fill="#0b0d12"/>
  <ellipse cx="60" cy="240" rx="220" ry="140" fill="url(#nnGlowCian)"/>
  <ellipse cx="640" cy="20" rx="220" ry="140" fill="url(#nnGlowAmbar)"/>

  <!-- conexiones -->
  <g stroke="#2a3240" stroke-width="1" opacity="0.55">
    <line id="l-i1h1" x1="120" y1="40"  x2="350" y2="20"/>
    <line x1="120" y1="40"  x2="350" y2="75"/>
    <line id="l-i1h3" x1="120" y1="40"  x2="350" y2="130"/>
    <line x1="120" y1="40"  x2="350" y2="185"/>
    <line x1="120" y1="40"  x2="350" y2="240"/>

    <line x1="120" y1="100" x2="350" y2="20"/>
    <line id="l-i2h2" x1="120" y1="100" x2="350" y2="75"/>
    <line x1="120" y1="100" x2="350" y2="130"/>
    <line id="l-i2h4" x1="120" y1="100" x2="350" y2="185"/>
    <line x1="120" y1="100" x2="350" y2="240"/>

    <line x1="120" y1="160" x2="350" y2="20"/>
    <line x1="120" y1="160" x2="350" y2="75"/>
    <line id="l-i3h3" x1="120" y1="160" x2="350" y2="130"/>
    <line x1="120" y1="160" x2="350" y2="185"/>
    <line id="l-i3h5" x1="120" y1="160" x2="350" y2="240"/>

    <line x1="120" y1="220" x2="350" y2="20"/>
    <line x1="120" y1="220" x2="350" y2="75"/>
    <line x1="120" y1="220" x2="350" y2="130"/>
    <line id="l-i4h4" x1="120" y1="220" x2="350" y2="185"/>
    <line x1="120" y1="220" x2="350" y2="240"/>

    <line id="l-h1o1" x1="350" y1="20"  x2="580" y2="70"/>
    <line x1="350" y1="20"  x2="580" y2="130"/>
    <line x1="350" y1="20"  x2="580" y2="190"/>

    <line x1="350" y1="75"  x2="580" y2="70"/>
    <line x1="350" y1="75"  x2="580" y2="130"/>
    <line x1="350" y1="75"  x2="580" y2="190"/>

    <line x1="350" y1="130" x2="580" y2="70"/>
    <line id="l-h3o2" x1="350" y1="130" x2="580" y2="130"/>
    <line x1="350" y1="130" x2="580" y2="190"/>

    <line x1="350" y1="185" x2="580" y2="70"/>
    <line x1="350" y1="185" x2="580" y2="130"/>
    <line x1="350" y1="185" x2="580" y2="190"/>

    <line x1="350" y1="240" x2="580" y2="70"/>
    <line x1="350" y1="240" x2="580" y2="130"/>
    <line id="l-h5o3" x1="350" y1="240" x2="580" y2="190"/>
  </g>

  <!-- pulsos viajando por algunas conexiones -->
  <g>
    <circle r="3.2" fill="#22d3ee" filter="url(#nodeGlow)">
      <animateMotion dur="1.8s" begin="0s" repeatCount="indefinite"><mpath href="#l-i1h1"/></animateMotion>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="1.8s" begin="0s" repeatCount="indefinite"/>
    </circle>
    <circle r="3.2" fill="#f5a524" filter="url(#nodeGlow)">
      <animateMotion dur="1.9s" begin="0.3s" repeatCount="indefinite"><mpath href="#l-i2h2"/></animateMotion>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="1.9s" begin="0.3s" repeatCount="indefinite"/>
    </circle>
    <circle r="3.2" fill="#22d3ee" filter="url(#nodeGlow)">
      <animateMotion dur="1.7s" begin="0.6s" repeatCount="indefinite"><mpath href="#l-i3h3"/></animateMotion>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="1.7s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
    <circle r="3.2" fill="#f5a524" filter="url(#nodeGlow)">
      <animateMotion dur="2s" begin="0.9s" repeatCount="indefinite"><mpath href="#l-i2h4"/></animateMotion>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="2s" begin="0.9s" repeatCount="indefinite"/>
    </circle>
    <circle r="3.2" fill="#22d3ee" filter="url(#nodeGlow)">
      <animateMotion dur="1.8s" begin="1.2s" repeatCount="indefinite"><mpath href="#l-i3h5"/></animateMotion>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="1.8s" begin="1.2s" repeatCount="indefinite"/>
    </circle>
    <circle r="3.2" fill="#f5a524" filter="url(#nodeGlow)">
      <animateMotion dur="1.9s" begin="1.5s" repeatCount="indefinite"><mpath href="#l-i4h4"/></animateMotion>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="1.9s" begin="1.5s" repeatCount="indefinite"/>
    </circle>

    <circle r="3.4" fill="#f5a524" filter="url(#nodeGlow)">
      <animateMotion dur="1.5s" begin="0.9s" repeatCount="indefinite"><mpath href="#l-h1o1"/></animateMotion>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="1.5s" begin="0.9s" repeatCount="indefinite"/>
    </circle>
    <circle r="3.4" fill="#22d3ee" filter="url(#nodeGlow)">
      <animateMotion dur="1.6s" begin="1.3s" repeatCount="indefinite"><mpath href="#l-h3o2"/></animateMotion>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="1.6s" begin="1.3s" repeatCount="indefinite"/>
    </circle>
    <circle r="3.4" fill="#f5a524" filter="url(#nodeGlow)">
      <animateMotion dur="1.7s" begin="1.7s" repeatCount="indefinite"><mpath href="#l-h5o3"/></animateMotion>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="1.7s" begin="1.7s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- nodos: entrada -->
  <g fill="#10131a" stroke="#22d3ee" stroke-width="2" filter="url(#nodeGlow)">
    <circle cx="120" cy="40"  r="7"/>
    <circle cx="120" cy="100" r="7"/>
    <circle cx="120" cy="160" r="7"/>
    <circle cx="120" cy="220" r="7"/>
  </g>

  <!-- nodos: capa oculta -->
  <g fill="#10131a" stroke-width="2">
    <circle cx="350" cy="20"  r="8" stroke="#f5a524" filter="url(#nodeGlow)"><animate attributeName="r" values="8;10;8" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="350" cy="75"  r="8" stroke="#22d3ee" filter="url(#nodeGlow)"><animate attributeName="r" values="8;10;8" dur="2.4s" begin="0.4s" repeatCount="indefinite"/></circle>
    <circle cx="350" cy="130" r="8" stroke="#f5a524" filter="url(#nodeGlow)"><animate attributeName="r" values="8;10;8" dur="2.4s" begin="0.8s" repeatCount="indefinite"/></circle>
    <circle cx="350" cy="185" r="8" stroke="#22d3ee" filter="url(#nodeGlow)"><animate attributeName="r" values="8;10;8" dur="2.4s" begin="1.2s" repeatCount="indefinite"/></circle>
    <circle cx="350" cy="240" r="8" stroke="#f5a524" filter="url(#nodeGlow)"><animate attributeName="r" values="8;10;8" dur="2.4s" begin="1.6s" repeatCount="indefinite"/></circle>
  </g>

  <!-- nodos: salida -->
  <g fill="#10131a" stroke-width="2.5" filter="url(#nodeGlow)">
    <circle cx="580" cy="70"  r="9" stroke="#f5a524"/>
    <circle cx="580" cy="130" r="9" stroke="#f5a524"/>
    <circle cx="580" cy="190" r="9" stroke="#f5a524"/>
  </g>
</svg>
