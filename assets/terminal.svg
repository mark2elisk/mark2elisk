<svg width="640" height="300" viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="'Cascadia Code', 'Consolas', monospace">
  <defs>
    <radialGradient id="glowCian" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowAmbar" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f5a524" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#f5a524" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="marca" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#f5a524"/>
    </linearGradient>
    <linearGradient id="borde" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a4150"/><stop offset="1" stop-color="#22303a"/>
    </linearGradient>
    <filter id="neon" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="sombra" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="none"/>
      <line x1="0" y1="0" x2="4" y2="0" stroke="#ffffff" stroke-opacity="0.025" stroke-width="1"/>
    </pattern>
    <clipPath id="c1"><rect x="0" y="88" width="0" height="24"><animate attributeName="width" from="0" to="420" begin="0.2s" dur="0.35s" fill="freeze"/></rect></clipPath>
    <clipPath id="c2"><rect x="0" y="114" width="0" height="24"><animate attributeName="width" from="0" to="420" begin="0.65s" dur="0.4s" fill="freeze"/></rect></clipPath>
    <clipPath id="c3"><rect x="0" y="148" width="0" height="24"><animate attributeName="width" from="0" to="420" begin="1.3s" dur="0.55s" fill="freeze"/></rect></clipPath>
    <clipPath id="c4"><rect x="0" y="174" width="0" height="24"><animate attributeName="width" from="0" to="560" begin="1.95s" dur="1.7s" fill="freeze"/></rect></clipPath>
    <clipPath id="c5"><rect x="0" y="208" width="0" height="24"><animate attributeName="width" from="0" to="420" begin="3.8s" dur="0.6s" fill="freeze"/></rect></clipPath>
    <clipPath id="c6"><rect x="0" y="234" width="0" height="24"><animate attributeName="width" from="0" to="420" begin="4.55s" dur="0.42s" fill="freeze"/></rect></clipPath>
  </defs>

  <rect width="640" height="300" fill="#0b0d12"/>
  <ellipse cx="70" cy="290" rx="220" ry="140" fill="url(#glowCian)"/>
  <ellipse cx="580" cy="10" rx="240" ry="150" fill="url(#glowAmbar)"/>

  <g filter="url(#sombra)">
    <rect x="20" y="20" width="600" height="260" rx="16" fill="#10131a" stroke="url(#borde)" stroke-width="1.5"/>
  </g>
  <path d="M20 36 a16 16 0 0 1 16 -16 h568 a16 16 0 0 1 16 16 v2 h-600 z" fill="url(#marca)" opacity="0.9"/>
  <rect x="21" y="37" width="598" height="242" rx="14" fill="url(#scanlines)"/>

  <circle cx="46" cy="50" r="5.5" fill="#e06060"/>
  <circle cx="66" cy="50" r="5.5" fill="#e0b055"/>
  <circle cx="86" cy="50" r="5.5" fill="#5fbf7a"/>

  <circle cx="576" cy="50" r="4" fill="#5fbf7a">
    <animate attributeName="opacity" values="1;0.35;1" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <text x="586" y="54" text-anchor="start" fill="#6b7280" font-size="11" letter-spacing="1">online</text>

  <g font-size="16" fill="#e5e7eb">
    <g clip-path="url(#c1)">
      <text x="44" y="104"><tspan fill="#22d3ee" font-weight="700" filter="url(#neon)">❯</tspan><tspan dx="10">whoami</tspan></text>
    </g>
    <g clip-path="url(#c2)">
      <text x="44" y="130" fill="#f5a524" font-weight="600" filter="url(#neon)">mark2elisk</text>
    </g>

    <g clip-path="url(#c3)">
      <text x="44" y="164"><tspan fill="#22d3ee" font-weight="700" filter="url(#neon)">❯</tspan><tspan dx="10">skills --ia</tspan></text>
    </g>
    <g clip-path="url(#c4)">
      <text x="44" y="190" fill="#f5a524" font-weight="600" filter="url(#neon)">Agentes · Automatizaciones · Software con IA</text>
    </g>

    <g clip-path="url(#c5)">
      <text x="44" y="224"><tspan fill="#22d3ee" font-weight="700" filter="url(#neon)">❯</tspan><tspan dx="10">colaboraciones</tspan></text>
    </g>
    <g clip-path="url(#c6)">
      <text x="44" y="250" fill="#f5a524" font-weight="600" filter="url(#neon)">ManYaro Tech</text>
    </g>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="5.0s" dur="0.01s" fill="freeze"/>
    <text x="44" y="272" fill="#22d3ee" font-weight="700" font-size="16" filter="url(#neon)">❯</text>
    <rect x="60" y="259" width="9" height="16" fill="#22d3ee" filter="url(#neon)">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
